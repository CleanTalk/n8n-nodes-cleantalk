# Publishes this n8n community node package to npm on every version tag push
# (or manually via "Run workflow").
#
# n8n requires community nodes to be published via GitHub Actions with npm
# provenance. npm is moving to staged publishing: this workflow stages the
# version with a provenance statement, then a maintainer approves it on
# npmjs.com (Staged Packages tab, 2FA required). Direct token publishing is
# being retired by npm in January 2027.
#
# Setup: add a granular access token ("Read and write (stage only)" is enough)
# as the NPM_TOKEN repository secret.

name: Publish

on:
  push:
    tags:
      - '*.*.*'
  workflow_dispatch:

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Update npm (staged publishing needs npm 11.15+)
        run: npm install -g npm@latest && npm --version

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Stage publish with provenance
        run: npm stage publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          RELEASE_MODE: 'true'
